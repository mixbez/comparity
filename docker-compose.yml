services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: comparity
      POSTGRES_USER: comparity
      POSTGRES_PASSWORD: comparity_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comparity']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://comparity:comparity_pass@postgres:5432/comparity
      REDIS_URL: redis://redis:6379
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL}
      MINI_APP_URL: ${MINI_APP_URL}
      MINI_APP_SHORT_NAME: ${MINI_APP_SHORT_NAME:-}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  backend-writershadow:
    build: ../writershadow
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      BOT_TOKEN: ${WRITERSHADOW_BOT_TOKEN}
      BOT_WEBHOOK_URL: https://v2202504269079335176.supersrv.de/ws-webhook
      DATABASE_URL: postgresql://writershadow:${WRITERSHADOW_DB_PASS}@postgres:5432/writershadow
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "writershadow:"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_USER_ID: ${ADMIN_USER_ID}
      OWNER_CONTACT: ${OWNER_CONTACT}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${MINI_APP_URL}/api
    restart: unless-stopped
    depends_on:
      - backend

  backend-flightdeals:
    build: ../flight-deals
    restart: unless-stopped
    environment:
      AVIASALES_TOKEN: ${AVIASALES_TOKEN}
      TELEGRAM_BOT_TOKEN: ${FLIGHTDEALS_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${ADMIN_USER_ID}
      WEBHOOK_HOST: https://v2202504269079335176.supersrv.de
      WEBHOOK_PORT: 443
      LISTEN_PORT: 8080
      WEBHOOK_PATH: /webhook-flightdeals
    ports:
      - "8080:8080"
    volumes:
      - flightdeals_state:/app/data

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  flightdeals_state:

